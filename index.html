<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🎉 백남권 교감 선생님 부임 축하 삼행시 🎉</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Canvas Confetti CDN -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <!-- Firebase SDK (v9 호환 모드 CDN) -->
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-database-compat.js"></script>
    <!-- Google Fonts (Noto Sans KR, Gaegu) -->
    <link href="https://fonts.googleapis.com/css2?family=Gaegu:wght@400;700&family=Noto+Sans+KR:wght@400;700;900&display=swap" rel="stylesheet">
    
    <style>
        body {
            font-family: 'Noto Sans KR', sans-serif;
            background: linear-gradient(135deg, #FF9A9E 0%, #FECFEF 99%, #FECFEF 100%);
            min-height: 100vh;
        }
        .handwriting {
            font-family: 'Gaegu', cursive;
        }
        .sticky-note {
            transition: all 0.3s ease;
            box-shadow: 5px 5px 15px rgba(0, 0, 0, 0.15);
        }
        .sticky-note:hover {
            transform: scale(1.05) rotate(0deg) !important;
            z-index: 10;
            box-shadow: 8px 8px 25px rgba(0, 0, 0, 0.25);
        }
        ::-webkit-scrollbar {
            width: 8px;
        }
        ::-webkit-scrollbar-track {
            background: rgba(255, 255, 255, 0.3);
            border-radius: 10px;
        }
        ::-webkit-scrollbar-thumb {
            background: rgba(236, 72, 153, 0.5);
            border-radius: 10px;
        }
    </style>
</head>
<body class="p-4 md:p-8 text-gray-800">

    <div class="max-w-6xl mx-auto space-y-8">
        
        <!-- Header Banner -->
        <header class="text-center bg-white/80 backdrop-blur-md rounded-3xl p-6 md:p-8 shadow-xl border-4 border-pink-300 relative overflow-hidden">
            <div class="absolute -top-10 -left-10 w-32 h-32 bg-yellow-300 rounded-full opacity-50 blur-xl"></div>
            <div class="absolute -bottom-10 -right-10 w-32 h-32 bg-pink-400 rounded-full opacity-50 blur-xl"></div>
            
            <span class="inline-block bg-pink-500 text-white font-bold px-4 py-1 rounded-full text-sm mb-3 animate-bounce">
                ✨ 도전! 삼행시 백일장 ✨
            </span>
            <h1 class="text-3xl md:text-5xl font-black text-transparent bg-clip-text bg-gradient-to-r from-pink-600 via-purple-600 to-indigo-600 mb-2">
                🌸 '백남권' 교감 선생님 삼행시 환영의 벽 🌸
            </h1>
            <p class="text-gray-600 font-medium md:text-lg">
                교감 선생님의 이름으로 재치 있고 따뜻한 삼행시를 지어주세요!
            </p>
        </header>

        <section class="bg-white/90 backdrop-blur-md rounded-3xl p-6 shadow-xl border-2 border-purple-200">
            <div class="flex items-center justify-between mb-4 border-b pb-3">
                <h2 class="text-xl md:text-2xl font-bold text-purple-700 flex items-center gap-2">
                    <span>☁️</span> 삼행시 인기 키워드 (워드클라우드)
                </h2>
                <span class="text-xs md:text-sm text-purple-500 bg-purple-100 px-3 py-1 rounded-full font-semibold">
                    실시간 자동 집계 중
                </span>
            </div>
            
            <div id="wordCloudContainer" class="min-h-[160px] flex flex-wrap items-center justify-center gap-3 p-4 bg-gradient-to-r from-purple-50 to-pink-50 rounded-2xl border border-purple-100">
            </div>
        </section>

        <div class="grid grid-cols-1 lg:grid-cols-3 gap-8">
            
            <!-- Left: Message Input Form -->
            <div class="lg:col-span-1">
                <div class="bg-white rounded-3xl p-6 shadow-xl border-2 border-pink-200 sticky top-8">
                    <h2 class="text-xl font-bold text-pink-600 mb-4 flex items-center gap-2">
                        <span>✏️</span> 삼행시 작성하기
                    </h2>
                    
                    <form id="messageForm" class="space-y-4">
                        <div>
                            <label class="block text-sm font-bold text-gray-700 mb-1">작성자 이름 / 닉네임</label>
                            <input type="text" id="authorInput" required placeholder="예: 3학년 1반 담임, 교무부장" 
                                class="w-full px-4 py-2 border-2 border-pink-100 rounded-xl focus:outline-none focus:border-pink-400 transition">
                        </div>

                        <div>
                            <label class="block text-sm font-bold text-gray-700 mb-1">메모지 색상 선택</label>
                            <div class="flex gap-3 pt-1">
                                <button type="button" data-color="yellow" class="color-btn w-8 h-8 rounded-full bg-yellow-200 border-2 border-yellow-400 ring-2 ring-offset-2 ring-pink-500"></button>
                                <button type="button" data-color="pink" class="color-btn w-8 h-8 rounded-full bg-pink-200 border-2 border-pink-400"></button>
                                <button type="button" data-color="green" class="color-btn w-8 h-8 rounded-full bg-green-200 border-2 border-green-400"></button>
                                <button type="button" data-color="blue" class="color-btn w-8 h-8 rounded-full bg-blue-200 border-2 border-blue-400"></button>
                                <button type="button" data-color="purple" class="color-btn w-8 h-8 rounded-full bg-purple-200 border-2 border-purple-400"></button>
                            </div>
                        </div>

                        <div class="space-y-2 pt-2 border-t border-pink-100">
                            <label class="block text-sm font-bold text-pink-600 mb-1">백 · 남 · 권 삼행시 입력</label>
                            
                            <div class="flex items-center gap-2">
                                <span class="w-8 h-8 flex items-center justify-center bg-pink-500 text-white font-black rounded-lg text-lg shrink-0">백</span>
                                <input type="text" id="line1Input" required placeholder="백 번을 생각해도" 
                                    class="w-full px-3 py-1.5 border-2 border-pink-100 rounded-xl focus:outline-none focus:border-pink-400 transition text-sm">
                            </div>

                            <div class="flex items-center gap-2">
                                <span class="w-8 h-8 flex items-center justify-center bg-purple-500 text-white font-black rounded-lg text-lg shrink-0">남</span>
                                <input type="text" id="line2Input" required placeholder="남다른 리더십을 가진 우리 교감 선생님!" 
                                    class="w-full px-3 py-1.5 border-2 border-pink-100 rounded-xl focus:outline-none focus:border-pink-400 transition text-sm">
                            </div>

                            <div class="flex items-center gap-2">
                                <span class="w-8 h-8 flex items-center justify-center bg-indigo-500 text-white font-black rounded-lg text-lg shrink-0">권</span>
                                <input type="text" id="line3Input" required placeholder="권해드립니다, 저희의 진심 어린 환영을!" 
                                    class="w-full px-3 py-1.5 border-2 border-pink-100 rounded-xl focus:outline-none focus:border-pink-400 transition text-sm">
                            </div>
                        </div>

                        <button type="submit" 
                            class="w-full bg-gradient-to-r from-pink-500 to-purple-600 text-white font-bold py-3 rounded-xl shadow-lg hover:from-pink-600 hover:to-purple-700 transform hover:-translate-y-0.5 active:translate-y-0 transition mt-4">
                            🎉 삼행시 붙이기
                        </button>
                    </form>
                </div>
            </div>

            <!-- Right: Sticky Note Wall -->
            <div class="lg:col-span-2">
                <div class="bg-white/60 backdrop-blur-sm rounded-3xl p-6 shadow-xl border-2 border-white/80 min-h-[500px]">
                    <div class="flex items-center justify-between mb-6">
                        <h2 class="text-2xl font-bold text-gray-800 flex items-center gap-2">
                            <span>📌</span> 삼행시 전시장 <span id="messageCount" class="text-sm bg-pink-500 text-white px-2.5 py-0.5 rounded-full">0</span>
                        </h2>
                        <span class="text-xs text-gray-500">실시간 연동 중 ⚡</span>
                    </div>

                    <div id="notesContainer" class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    </div>
                </div>
            </div>

        </div>
    </div>

    <script>
        // 🚨 [중요] Firebase 콘솔에서 복사한 설정값을 아래에 붙여넣어주세요!
        const firebaseConfig = {
            apiKey: "YOUR_API_KEY",
            authDomain: "YOUR_PROJECT_ID.firebaseapp.com",
            databaseURL: "https://YOUR_PROJECT_ID-default-rtdb.firebaseio.com",
            projectId: "YOUR_PROJECT_ID",
            storageBucket: "YOUR_PROJECT_ID.appspot.com",
            messagingSenderId: "YOUR_SENDER_ID",
            appId: "YOUR_APP_ID"
        };

        // Firebase 초기화 (설정값이 입력되었을 때만 작동)
        let db = null;
        if (firebaseConfig.apiKey !== "YOUR_API_KEY") {
            firebase.initializeApp(firebaseConfig);
            db = firebase.database();
        }

        let messages = [];
        let selectedColor = 'yellow';

        const colorMap = {
            yellow: 'bg-yellow-200 text-yellow-900 border-yellow-300',
            pink: 'bg-pink-200 text-pink-900 border-pink-300',
            green: 'bg-emerald-200 text-emerald-900 border-emerald-300',
            blue: 'bg-sky-200 text-sky-900 border-sky-300',
            purple: 'bg-purple-200 text-purple-900 border-purple-300'
        };

        const messageForm = document.getElementById('messageForm');
        const authorInput = document.getElementById('authorInput');
        const line1Input = document.getElementById('line1Input');
        const line2Input = document.getElementById('line2Input');
        const line3Input = document.getElementById('line3Input');
        const notesContainer = document.getElementById('notesContainer');
        const wordCloudContainer = document.getElementById('wordCloudContainer');
        const messageCount = document.getElementById('messageCount');
        const colorBtns = document.querySelectorAll('.color-btn');

        colorBtns.forEach(btn => {
            btn.addEventListener('click', () => {
                colorBtns.forEach(b => b.classList.remove('ring-2', 'ring-offset-2', 'ring-pink-500'));
                btn.classList.add('ring-2', 'ring-offset-2', 'ring-pink-500');
                selectedColor = btn.dataset.color;
            });
        });

        function getRandomRotation() {
            const rotations = ['-3deg', '-2deg', '-1deg', '1deg', '2deg', '3deg'];
            return rotations[Math.floor(Math.random() * rotations.length)];
        }

        // 삼행시 화면 렌더링
        function renderNotes() {
            notesContainer.innerHTML = '';
            messageCount.textContent = messages.length;

            messages.forEach(msg => {
                const noteElement = document.createElement('div');
                const colorClasses = colorMap[msg.color] || colorMap.yellow;
                
                noteElement.className = `sticky-note ${colorClasses} p-5 rounded-2xl border-t-4 relative flex flex-col justify-between min-h-[180px]`;
                noteElement.style.transform = `rotate(${msg.rotation || '0deg'})`;

                noteElement.innerHTML = `
                    <div class="handwriting text-lg leading-relaxed mb-4 space-y-1">
                        <div><span class="font-bold text-pink-700 bg-pink-100/80 px-1.5 py-0.5 rounded mr-1">백</span> ${msg.line1}</div>
                        <div><span class="font-bold text-purple-700 bg-purple-100/80 px-1.5 py-0.5 rounded mr-1">남</span> ${msg.line2}</div>
                        <div><span class="font-bold text-indigo-700 bg-indigo-100/80 px-1.5 py-0.5 rounded mr-1">권</span> ${msg.line3}</div>
                    </div>
                    <div class="flex items-center justify-between text-xs font-bold opacity-75 border-t border-black/10 pt-2">
                        <span>From. ${msg.author}</span>
                        <button onclick="deleteNote('${msg.id}')" class="text-red-500 hover:text-red-700 opacity-50 hover:opacity-100 transition">삭제</button>
                    </div>
                `;
                notesContainer.appendChild(noteElement);
            });

            updateWordCloud();
        }

        // 삼행시 등록
        messageForm.addEventListener('submit', (e) => {
            e.preventDefault();

            const author = authorInput.value.trim();
            const line1 = line1Input.value.trim();
            const line2 = line2Input.value.trim();
            const line3 = line3Input.value.trim();

            if (!author || !line1 || !line2 || !line3) return;

            const newMsg = {
                author: author,
                line1: line1,
                line2: line2,
                line3: line3,
                color: selectedColor,
                rotation: getRandomRotation(),
                timestamp: Date.now()
            };

            // Firebase가 설정된 경우 실시간 DB에 저장
            if (db) {
                db.ref('poems').push(newMsg);
            } else {
                // Firebase 연결 전 테스트용 로컬 저장
                newMsg.id = Date.now().toString();
                messages.unshift(newMsg);
                renderNotes();
            }

            confetti({
                particleCount: 120,
                spread: 80,
                origin: { y: 0.6 }
            });

            line1Input.value = '';
            line2Input.value = '';
            line3Input.value = '';
            line1Input.focus();
        });

        // 삭제 로직
        function deleteNote(id) {
            if (db) {
                db.ref('poems/' + id).remove();
            } else {
                messages = messages.filter(msg => msg.id !== id);
                renderNotes();
            }
        }

        // 실시간 Firebase 데이터 수신 구독
        function listenToFirebase() {
            if (!db) return;

            db.ref('poems').orderByChild('timestamp').on('value', (snapshot) => {
                const data = snapshot.val();
                messages = [];
                if (data) {
                    Object.keys(data).forEach(key => {
                        messages.unshift({
                            id: key,
                            ...data[key]
                        });
                    });
                } else {
                    // 데이터가 비었을 때 샘플 1개 표시
                    messages = [{
                        id: 'sample1',
                        author: '교장 선생님',
                        line1: '백 만 번을 환영해도 모자란 우리 교감 선생님!',
                        line2: '남다른 열정으로 우리 학교를 이끌어주실',
                        line3: '권위 대신 친근함으로 다가와 주실 선장님을 응원합니다!',
                        color: 'yellow',
                        rotation: '-2deg'
                    }];
                }
                renderNotes();
            });
        }

        // 워드클라우드 생성
        function updateWordCloud() {
            const wordCounts = {};
            
            messages.forEach(msg => {
                const fullText = `${msg.line1} ${msg.line2} ${msg.line3}`;
                const words = fullText.replace(/[^\w\s가-힣]/g, '').split(/\s+/);
                const ignoreList = ['백', '남', '권', '교감', '선생님', '우리', '함께', '있는', '하면'];

                words.forEach(word => {
                    if (word.length >= 2 && !ignoreList.includes(word)) { 
                        wordCounts[word] = (wordCounts[word] || 0) + 1;
                    }
                });
            });

            const sortedWords = Object.entries(wordCounts)
                .sort((a, b) => b[1] - a[1])
                .slice(0, 15);

            wordCloudContainer.innerHTML = '';

            if (sortedWords.length === 0) {
                wordCloudContainer.innerHTML = '<span class="text-gray-400 text-sm">작성된 삼행시가 늘어나면 주요 단어가 워드클라우드로 나타납니다!</span>';
                return;
            }

            const fontColors = ['text-pink-600', 'text-purple-600', 'text-indigo-600', 'text-blue-600', 'text-emerald-600', 'text-amber-600'];

            sortedWords.forEach(([word, count], index) => {
                const badge = document.createElement('span');
                let fontSize = index === 0 ? 'text-3xl md:text-4xl' : (index < 3 ? 'text-2xl md:text-3xl' : 'text-base');
                let fontWeight = index < 3 ? 'font-black' : 'font-semibold';
                const colorClass = fontColors[index % fontColors.length];

                badge.className = `${fontSize} ${fontWeight} ${colorClass} transition-all hover:scale-110 bg-white px-3 py-1 rounded-full shadow-sm border border-gray-100`;
                badge.innerHTML = `${word} <sub class="text-xs text-gray-400 font-normal">${count}</sub>`;
                
                wordCloudContainer.appendChild(badge);
            });
        }

        window.onload = function() {
            if (db) {
                listenToFirebase();
            } else {
                // 샘플 데이터 1개 설정
                messages = [{
                    id: 'sample1',
                    author: '교장 선생님',
                    line1: '백 만 번을 환영해도 모자란 우리 교감 선생님!',
                    line2: '남다른 열정으로 우리 학교를 이끌어주실',
                    line3: '권위 대신 친근함으로 다가와 주실 선장님을 응원합니다!',
                    color: 'yellow',
                    rotation: '-2deg'
                }];
                renderNotes();
            }
        };
    </script>
</body>
</html>
