<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🎉 교감 선생님 부임을 진심으로 환영합니다! 🎉</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Canvas Confetti CDN -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <!-- Google Fonts (Noto Sans KR, Gaegu) -->
    <link href="https://fonts.googleapis.com/css2?family=Gaegu:wght@400;700&family=Noto+Sans+KR:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Noto Sans KR', sans-serif;
            background: linear-gradient(135deg, #FF9A9E 0%, #FECFEF 99%, #FECFEF 100%);
            min-height: 100vh;
        }
        .handwriting {
            font-family: 'Gaegu', cursive;
        }
        /* Sticky Note Styles */
        .sticky-note {
            transition: all 0.3s ease;
            box-shadow: 5px 5px 15px rgba(0, 0, 0, 0.15);
        }
        .sticky-note:hover {
            transform: scale(1.05) rotate(0deg) !important;
            z-index: 10;
            box-shadow: 8px 8px 25px rgba(0, 0, 0, 0.25);
        }
        /* Custom Scrollbar */
        ::-webkit-scrollbar {
            width: 8px;
        }
        ::-webkit-scrollbar-track {
            background: rgba(255, 255, 255, 0.3);
            border-radius: 10px;
        }
        ::-webkit-scrollbar-thumb {
            background: rgba(236, 72, 153, 0.5);
            border-radius: 10px;
        }
    </style>
</head>
<body class="p-4 md:p-8 text-gray-800">

    <div class="max-w-6xl mx-auto space-y-8">
        
        <!-- Header Banner -->
        <header class="text-center bg-white/80 backdrop-blur-md rounded-3xl p-6 md:p-8 shadow-xl border-4 border-pink-300 relative overflow-hidden">
            <div class="absolute -top-10 -left-10 w-32 h-32 bg-yellow-300 rounded-full opacity-50 blur-xl"></div>
            <div class="absolute -bottom-10 -right-10 w-32 h-32 bg-pink-400 rounded-full opacity-50 blur-xl"></div>
            
            <span class="inline-block bg-pink-500 text-white font-bold px-4 py-1 rounded-full text-sm mb-3 animate-bounce">
                ✨ 환영합니다! ✨
            </span>
            <h1 class="text-3xl md:text-5xl font-black text-transparent bg-clip-text bg-gradient-to-r from-pink-600 via-purple-600 to-indigo-600 mb-2">
                🌸 교감 선생님 부임 환영의 벽 🌸
            </h1>
            <p class="text-gray-600 font-medium md:text-lg">
                선생님들의 따뜻한 환영 메시지와 마음을 전해주세요!
            </p>
        </header>

        <!-- Top Section: Live Word Cloud -->
        <section class="bg-white/90 backdrop-blur-md rounded-3xl p-6 shadow-xl border-2 border-purple-200">
            <div class="flex items-center justify-between mb-4 border-b pb-3">
                <h2 class="text-xl md:text-2xl font-bold text-purple-700 flex items-center gap-2">
                    <span>☁️</span> 실시간 환영 키워드 (워드클라우드)
                </h2>
                <span class="text-xs md:text-sm text-purple-500 bg-purple-100 px-3 py-1 rounded-full font-semibold">
                    자동 집계 중
                </span>
            </div>
            
            <!-- Word Cloud Box -->
            <div id="wordCloudContainer" class="min-h-[160px] flex flex-wrap items-center justify-center gap-3 p-4 bg-gradient-to-r from-purple-50 to-pink-50 rounded-2xl border border-purple-100">
                <!-- Word cloud items will be injected here -->
            </div>
        </section>

        <!-- Main Section: Form & Sticky Note Wall -->
        <div class="grid grid-cols-1 lg:grid-cols-3 gap-8">
            
            <!-- Left: Message Input Form -->
            <div class="lg:col-span-1">
                <div class="bg-white rounded-3xl p-6 shadow-xl border-2 border-pink-200 sticky top-8">
                    <h2 class="text-xl font-bold text-pink-600 mb-4 flex items-center gap-2">
                        <span>✏️</span> 메시지 남기기
                    </h2>
                    
                    <form id="messageForm" class="space-y-4">
                        <div>
                            <label class="block text-sm font-bold text-gray-700 mb-1">작성자 이름 / 닉네임</label>
                            <input type="text" id="authorInput" required placeholder="예: 3학년 1반 담임, 교무부장" 
                                class="w-full px-4 py-2 border-2 border-pink-100 rounded-xl focus:outline-none focus:border-pink-400 transition">
                        </div>

                        <div>
                            <label class="block text-sm font-bold text-gray-700 mb-1">메모지 색상 선택</label>
                            <div class="flex gap-3 pt-1">
                                <button type="button" data-color="yellow" class="color-btn w-8 h-8 rounded-full bg-yellow-200 border-2 border-yellow-400 ring-2 ring-offset-2 ring-pink-500"></button>
                                <button type="button" data-color="pink" class="color-btn w-8 h-8 rounded-full bg-pink-200 border-2 border-pink-400"></button>
                                <button type="button" data-color="green" class="color-btn w-8 h-8 rounded-full bg-green-200 border-2 border-green-400"></button>
                                <button type="button" data-color="blue" class="color-btn w-8 h-8 rounded-full bg-blue-200 border-2 border-blue-400"></button>
                                <button type="button" data-color="purple" class="color-btn w-8 h-8 rounded-full bg-purple-200 border-2 border-purple-400"></button>
                            </div>
                        </div>

                        <div>
                            <label class="block text-sm font-bold text-gray-700 mb-1">환영 인사 내용</label>
                            <textarea id="contentInput" required rows="4" placeholder="교감 선생님, 부임을 축하드립니다! 잘 부탁드립니다 축하합니다 응원합니다" 
                                class="w-full px-4 py-2 border-2 border-pink-100 rounded-xl focus:outline-none focus:border-pink-400 transition resize-none"></textarea>
                        </div>

                        <button type="submit" 
                            class="w-full bg-gradient-to-r from-pink-500 to-purple-600 text-white font-bold py-3 rounded-xl shadow-lg hover:from-pink-600 hover:to-purple-700 transform hover:-translate-y-0.5 active:translate-y-0 transition">
                            🎉 환영 메시지 붙이기
                        </button>
                    </form>
                </div>
            </div>

            <!-- Right: Sticky Note Wall -->
            <div class="lg:col-span-2">
                <div class="bg-white/60 backdrop-blur-sm rounded-3xl p-6 shadow-xl border-2 border-white/80 min-h-[500px]">
                    <div class="flex items-center justify-between mb-6">
                        <h2 class="text-2xl font-bold text-gray-800 flex items-center gap-2">
                            <span>📌</span> 메시지 벽 <span id="messageCount" class="text-sm bg-pink-500 text-white px-2.5 py-0.5 rounded-full">0</span>
                        </h2>
                        <span class="text-xs text-gray-500">메모지에 마우스를 올리면 크게 보여요!</span>
                    </div>

                    <!-- Note Grid -->
                    <div id="notesContainer" class="grid grid-cols-1 md:grid-cols-2 gap-4">
                        <!-- Sticky Notes will be injected here -->
                    </div>
                </div>
            </div>

        </div>
    </div>

    <script>
        // Default Sample Data
        let messages = [
            { id: 1, author: "교장 선생님", content: "교감 선생님 부임을 온 마음으로 환영합니다! 함께 멋진 학교 만들어 가요.", color: "yellow", rotation: "-2deg" },
            { id: 2, author: "행정실장", content: "환영합니다! 학교 발전을 위해 함께 노력하겠습니다. 축하드립니다!", color: "pink", rotation: "3deg" },
            { id: 3, author: "1학년 부장", content: "교감 선생님 오셔서 너무 든든합니다! 축하드립니다 기대됩니다!", color: "blue", rotation: "-1deg" },
            { id: 4, author: "보건 교사", content: "부임을 축하드립니다! 늘 건강하시고 행복한 학교 생활 되시길 응원합니다.", color: "green", rotation: "2deg" }
        ];

        let selectedColor = 'yellow';

        // Sticky Note Color Palette (Tailwind Classes)
        const colorMap = {
            yellow: 'bg-yellow-200 text-yellow-900 border-yellow-300',
            pink: 'bg-pink-200 text-pink-900 border-pink-300',
            green: 'bg-emerald-200 text-emerald-900 border-emerald-300',
            blue: 'bg-sky-200 text-sky-900 border-sky-300',
            purple: 'bg-purple-200 text-purple-900 border-purple-300'
        };

        // DOM Elements
        const messageForm = document.getElementById('messageForm');
        const authorInput = document.getElementById('authorInput');
        const contentInput = document.getElementById('contentInput');
        const notesContainer = document.getElementById('notesContainer');
        const wordCloudContainer = document.getElementById('wordCloudContainer');
        const messageCount = document.getElementById('messageCount');
        const colorBtns = document.querySelectorAll('.color-btn');

        // Color Picker Logic
        colorBtns.forEach(btn => {
            btn.addEventListener('click', () => {
                colorBtns.forEach(b => b.classList.remove('ring-2', 'ring-offset-2', 'ring-pink-500'));
                btn.classList.add('ring-2', 'ring-offset-2', 'ring-pink-500');
                selectedColor = btn.dataset.color;
            });
        });

        // Generate Random Rotations for Sticky Notes
        function getRandomRotation() {
            const rotations = ['-3deg', '-2deg', '-1deg', '1deg', '2deg', '3deg'];
            return rotations[Math.floor(Math.random() * rotations.length)];
        }

        // Render Sticky Notes Wall
        function renderNotes() {
            notesContainer.innerHTML = '';
            messageCount.textContent = messages.length;

            messages.forEach(msg => {
                const noteElement = document.createElement('div');
                const colorClasses = colorMap[msg.color] || colorMap.yellow;
                
                noteElement.className = `sticky-note ${colorClasses} p-5 rounded-2xl border-t-4 relative flex flex-col justify-between min-h-[160px]`;
                noteElement.style.transform = `rotate(${msg.rotation})`;

                noteElement.innerHTML = `
                    <div class="handwriting text-xl leading-relaxed mb-4 whitespace-pre-line">${msg.content}</div>
                    <div class="flex items-center justify-between text-xs font-bold opacity-75 border-t border-black/10 pt-2">
                        <span>From. ${msg.author}</span>
                        <button onclick="deleteNote(${msg.id})" class="text-red-500 hover:text-red-700 opacity-50 hover:opacity-100 transition">삭제</button>
                    </div>
                `;
                notesContainer.appendChild(noteElement);
            });

            updateWordCloud();
        }

        // Add New Note
        messageForm.addEventListener('submit', (e) => {
            e.preventDefault();

            const author = authorInput.value.trim();
            const content = contentInput.value.trim();

            if (!author || !content) return;

            const newMsg = {
                id: Date.now(),
                author: author,
                content: content,
                color: selectedColor,
                rotation: getRandomRotation()
            };

            messages.unshift(newMsg);
            renderNotes();

            // Trigger Confetti Animation
            confetti({
                particleCount: 100,
                spread: 70,
                origin: { y: 0.6 }
            });

            // Reset Form
            contentInput.value = '';
            contentInput.focus();
        });

        // Delete Note
        function deleteNote(id) {
            messages = messages.filter(msg => msg.id !== id);
            renderNotes();
        }

        // Simple Word Cloud Generator
        function updateWordCloud() {
            const wordCounts = {};
            
            // Extract and count words from all message contents
            messages.forEach(msg => {
                // Split by spaces and remove special characters
                const words = msg.content.replace(/[^\w\s가-힣]/g, '').split(/\s+/);
                words.forEach(word => {
                    if (word.length > 1) { // Ignore 1-letter words
                        wordCounts[word] = (wordCounts[word] || 0) + 1;
                    }
                });
            });

            // Convert to Array & Sort by Count
            const sortedWords = Object.entries(wordCounts)
                .sort((a, b) => b[1] - a[1])
                .slice(0, 15); // Top 15 words

            wordCloudContainer.innerHTML = '';

            if (sortedWords.length === 0) {
                wordCloudContainer.innerHTML = '<span class="text-gray-400 text-sm">작성된 메시지가 쌓이면 키워드가 나타납니다!</span>';
                return;
            }

            // Word Cloud Styling Palette
            const fontColors = [
                'text-pink-600', 'text-purple-600', 'text-indigo-600', 
                'text-blue-600', 'text-emerald-600', 'text-amber-600'
            ];

            sortedWords.forEach(([word, count], index) => {
                const badge = document.createElement('span');
                
                // Calculate font size according to frequency
                let fontSize = 'text-base';
                let fontWeight = 'font-normal';

                if (index === 0) {
                    fontSize = 'text-3xl md:text-4xl';
                    fontWeight = 'font-black';
                } else if (index < 3) {
                    fontSize = 'text-2xl md:text-3xl';
                    fontWeight = 'font-extrabold';
                } else if (index < 6) {
                    fontSize = 'text-xl md:text-2xl';
                    fontWeight = 'font-bold';
                } else {
                    fontSize = 'text-sm md:text-base';
                    fontWeight = 'font-medium';
                }

                const colorClass = fontColors[index % fontColors.length];

                badge.className = `${fontSize} ${fontWeight} ${colorClass} transition-all hover:scale-110 cursor-pointer bg-white px-3 py-1 rounded-full shadow-sm border border-gray-100`;
                badge.innerHTML = `${word} <sub class="text-xs text-gray-400 font-normal">${count}</sub>`;
                
                wordCloudContainer.appendChild(badge);
            });
        }

        // Initial Render on Page Load
        window.onload = function() {
            renderNotes();
        };
    </script>
</body>
</html>
